<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620"><rect width="1440" height="620" rx="24" fill="#0b1020"/><text x="70" y="82" fill="#9b8cff" font-family="Arial" font-size="13" letter-spacing="2">GET STARTED</text><text x="70" y="137" fill="#f2f5fc" font-family="Arial" font-size="38" font-weight="bold">From download to your first production plan</text><g font-family="Arial"><g><rect x="70" y="200" width="285" height="270" rx="18" fill="#111a2d" stroke="#34425e"/><circle cx="112" cy="244" r="23" fill="#8b80ed"/><text x="112" y="252" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">1</text><text x="105" y="310" fill="#fff" font-size="21" font-weight="bold">Open the app</text><text x="105" y="348" fill="#aab6cb" font-size="15">Use the GitHub Pages</text><text x="105" y="372" fill="#aab6cb" font-size="15">deployment or run locally</text><text x="105" y="396" fill="#aab6cb" font-size="15">with Python 3.</text></g><g><rect x="395" y="200" width="285" height="270" rx="18" fill="#111a2d" stroke="#34425e"/><circle cx="437" cy="244" r="23" fill="#8b80ed"/><text x="437" y="252" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">2</text><text x="430" y="310" fill="#fff" font-size="21" font-weight="bold">Create a project</text><text x="430" y="348" fill="#aab6cb" font-size="15">Pick a niche and format,</text><text x="430" y="372" fill="#aab6cb" font-size="15">draft an idea and shape</text><text x="430" y="396" fill="#aab6cb" font-size="15">your script.</text></g><g><rect x="720" y="200" width="285" height="270" rx="18" fill="#111a2d" stroke="#34425e"/><circle cx="762" cy="244" r="23" fill="#8b80ed"/><text x="762" y="252" fill="#fff" text-anchor="middle" font-size="20" font-weight="bold">3</text><text x="755" y="310" fill="#fff" font-size="21" font-weight="bold">Plan production</text><text x="755" y="348" fill="#aab6cb" font-size="15">Add scenes, visual notes,</text><text x="755" y="372" fill="#aab6cb" font-size="15">voice direction and</text><text x="755" y="396" fill="#aab6cb" font-size="15">editable captions.</text></g><g><rect x="1045" y="200" width="325" height="270" rx="18" fill="#111a2d" stroke="#34425e"/><circle cx="1087" cy="244" r="23" fill="#63d7c5"/><text x="1087" y="252" fill="#09151b" text-anchor="middle" font-size="20" font-weight="bold">4</text><text x="1080" y="310" fill="#fff" font-size="21" font-weight="bold">Export your pack</text><text x="1080" y="348" fill="#aab6cb" font-size="15">Download JSON, script,</text><text x="1080" y="372" fill="#aab6cb" font-size="15">shot list and SRT. Render</text><text x="1080" y="396" fill="#aab6cb" font-size="15">locally with FFmpeg.</text></g><path d="M355 335h40m-8-8 8 8-8 8M680 335h40m-8-8 8 8-8 8M1005 335h40m-8-8 8 8-8 8" fill="none" stroke="#6476e8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="70" y="535" fill="#63d7c5" font-family="Arial" font-size="15" font-weight="bold">OPTIONAL CLOUD SYNC</text><text x="270" y="535" fill="#aab6cb" font-family="Arial" font-size="15">Configure Supabase URL + public anon key, run the SQL schema, enable providers and verify RLS with two accounts.</text><text x="70" y="575" fill="#71809b" font-family="Arial" font-size="12">Setup illustration · Local mode works without account configuration · Cloud sync requires owner setup</text></svg>